# MiniLM behavioural router — primary_action classifier
model_name: sentence-transformers/all-MiniLM-L6-v2
# Alternative: distilbert-base-uncased
# model_name: distilbert-base-uncased

task: primary_action
labels:
  - answer_small
  - rag
  - tools
  - escalate_large

data:
  train_path: data/routing/train_seed.jsonl
  eval_path: data/routing/eval_seed.jsonl
  text_field: query
  label_field: primary_action

training:
  max_length: 128
  batch_size: 16
  learning_rate: 2.0e-5
  num_epochs: 5
  weight_decay: 0.01
  seed: 42
  warmup_ratio: 0.1

eval:
  metrics:
    - accuracy
    - macro_f1
    - confusion_matrix

output_dir: outputs/router_minilm
