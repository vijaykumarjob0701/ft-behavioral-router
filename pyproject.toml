[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fta-router"
version = "0.1.0"
description = "FT-first hybrid behavioural router: answer_small | rag | tools | escalate_large (public paper companion)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vijay Kumar", email = "vijaykumarjob0701@gmail.com" }]
dependencies = [
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
train = [
  "torch>=2.0",
  "transformers>=4.36",
  "datasets>=2.16",
  "accelerate>=0.25",
]

[project.urls]
Homepage = "https://github.com/vijaykumarjob0701/ft-behavioral-router"
Repository = "https://github.com/vijaykumarjob0701/ft-behavioral-router"

[tool.setuptools.packages.find]
where = ["src"]
